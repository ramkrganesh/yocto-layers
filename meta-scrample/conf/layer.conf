# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "scrample"
BBFILE_PATTERN_scrample = "^${LAYERDIR}/"
BBFILE_PRIORITY_scrample = "6"

LAYERDEPENDS_scrample = "core"
LAYERSERIES_COMPAT_scrample = "scarthgap"
