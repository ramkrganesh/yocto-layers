# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "bazel-native"
BBFILE_PATTERN_bazel-native = "^${LAYERDIR}/"
BBFILE_PRIORITY_bazel-native = "6"

LAYERDEPENDS_bazel-native = "core"
LAYERSERIES_COMPAT_bazel-native = "scarthgap"
